name: SMTP Diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Diagnose secrets and SMTP
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          python3 - <<'PY'
          import os, smtplib
          u = os.environ.get("EMAIL_USER", "")
          p = os.environ.get("EMAIL_PASS", "")
          print("EMAIL_USER len:", len(u))
          print("EMAIL_PASS len:", len(p))
          print("EMAIL_USER == 'Roy_Send@126.com':", u == "Roy_Send@126.com")
          print("EMAIL_USER == 'roy_send@126.com':", u == "roy_send@126.com")
          print("EMAIL_USER.lower() == 'roy_send@126.com':", u.lower() == "roy_send@126.com")
          print("EMAIL_USER endswith 126.com:", u.endswith("126.com"))
          print("EMAIL_PASS == 'AFjM5r2FYUrtDppq':", p == "AFjM5r2FYUrtDppq")
          try:
              s = smtplib.SMTP_SSL("smtp.126.com", 465, timeout=20)
              s.login(u, p)
              print("SMTP LOGIN: OK")
              s.quit()
          except Exception as e:
              print("SMTP LOGIN FAILED:", type(e).__name__, e)
          PY
