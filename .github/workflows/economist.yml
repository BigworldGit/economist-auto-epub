name: Economist Weekly EPUB

on:
  schedule:
    - cron: '0 10 * * 5'   # UTC 10:00 = 北京时间 (Asia/Shanghai) 周五 18:00
  workflow_dispatch:
    inputs:
      issue_date:
        description: "Optional catch-up cutoff date in YYYY.MM.DD or YYYY-MM-DD"
        required: false
        type: string
      wait_for_current_issue:
        description: "Legacy compatibility input"
        required: false
        default: true
        type: boolean

concurrency:
  group: economist-weekly-email
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Determine catch-up cutoff date
        id: target_issue
        run: |
          issue_date="$(python -c 'from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; today = datetime.now(ZoneInfo("Asia/Shanghai")).date(); print((today + timedelta(days=(5 - today.weekday()) % 7)).strftime("%Y.%m.%d"))')"
          echo "date=${issue_date}" >> "$GITHUB_OUTPUT"

      - name: Send all available unsent issues
        env:
          API2CONVERT_KEY: ${{ secrets.API2CONVERT_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ISSUE_DATE: ${{ inputs.issue_date || steps.target_issue.outputs.date }}
        run: python main.py
