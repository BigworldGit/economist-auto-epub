name: Economist Weekly EPUB

on:
  # cron-job.org dispatches this workflow every Friday to avoid GitHub's
  # scheduled-workflow inactivity suspension and duplicate emails.
  workflow_dispatch:
    inputs:
      issue_date:
        description: "Optional issue date in YYYY.MM.DD or YYYY-MM-DD"
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          API2CONVERT_KEY: ${{ secrets.API2CONVERT_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ISSUE_DATE: ${{ github.event.inputs.issue_date }}
        run: python main.py
